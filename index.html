<title>H2-Flugzeug Business Case — Interaktiv (G3)</title>
<style>
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --ink:#182430; --muted:#5B6B77;
  --accent:#0E7C9E; --accent-soft:#D9EBF1; --bad:#A63A2E; --line:#D4DCE1;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F151A; --surface:#171F26; --ink:#D9E4EC; --muted:#8DA0AE;
    --accent:#45B8DA; --accent-soft:#123A47; --bad:#D96A5B; --line:#2A3742;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  font-family:"Avenir Next","Helvetica Neue",-apple-system,system-ui,sans-serif;
  font-size:16px;line-height:1.6}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:2rem 2.2rem;max-width:380px;width:calc(100% - 2rem);margin:1rem}
.eyebrow{font-family:"Avenir Next Condensed","Avenir Next",sans-serif;text-transform:uppercase;
  letter-spacing:.14em;font-size:12px;color:var(--muted);font-weight:600}
h1{font-family:"Avenir Next Condensed","Avenir Next",sans-serif;font-weight:600;
  font-size:24px;line-height:1.2;margin:.3rem 0 .5rem}
p.hint{color:var(--muted);font-size:13.5px;margin:0 0 1.2rem}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:.3rem}
input[type=password]{width:100%;padding:.6rem .75rem;font-size:16px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;outline:none}
input[type=password]:focus{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:.5rem;margin:.9rem 0 1.1rem;font-size:13.5px;color:var(--muted)}
.row input{accent-color:var(--accent)}
button{width:100%;padding:.65rem;font-size:15px;font-weight:600;color:#fff;
  background:var(--accent);border:none;border-radius:8px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.err{color:var(--bad);font-size:13.5px;margin:.7rem 0 0;min-height:1.2em}
</style></head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const SALT = b64(P.salt), NONCE = b64(P.nonce), CT = b64(P.ct);
const STORE_KEY = "h2tool_key_" + P.salt.slice(0, 12);

async function deriveKey(pw){
  const raw = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:SALT, iterations:P.iter, hash:"SHA-256"},
    raw, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function unlock(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:NONCE}, key, CT);
  const html = new TextDecoder().decode(pt);
  if (document.readyState === "loading")
    await new Promise(r => document.addEventListener("DOMContentLoaded", r, {once:true}));
  document.open(); document.write(html); document.close();
}
async function storeKey(key, persistent){
  const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))));
  try{ (persistent ? localStorage : sessionStorage).setItem(STORE_KEY, raw); }catch(e){}
}
async function tryStored(){
  for (const store of [sessionStorage, localStorage]){
    let raw = null;
    try{ raw = store.getItem(STORE_KEY); }catch(e){}
    if (!raw) continue;
    try{
      const key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", true, ["decrypt"]);
      await unlock(key);
      return true;
    }catch(e){
      try{ store.removeItem(STORE_KEY); }catch(_){}
    }
  }
  return false;
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Entschlüssele…"; err.textContent = "";
  try{
    const key = await deriveKey(document.getElementById("pw").value);
    await storeKey(key, document.getElementById("keep").checked);
    await unlock(key);
  }catch(e){
    err.textContent = "Falsches Passwort.";
    btn.disabled = false; btn.textContent = "Entsperren";
    document.getElementById("pw").select();
  }
});
tryStored();
